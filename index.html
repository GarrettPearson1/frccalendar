<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Custom scrollbar to keep event lists neat */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
        }
        .calendar-cell {
            transition: all 0.2s ease;
        }
        .calendar-cell:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            z-index: 10;
        }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col">

    <div class="flex-grow container mx-auto px-4 py-8 max-w-6xl flex flex-col h-full">
        <!-- Header area -->
        <div class="bg-white rounded-t-2xl shadow-sm border border-b-0 border-gray-200 p-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-bold text-gray-900 flex items-center gap-2">
                <i class="fa-regular fa-calendar-days text-blue-600"></i>
                My Calendar
            </h1>
            
            <!-- Navigation -->
            <div class="flex items-center gap-4 bg-gray-50 rounded-lg p-1 border border-gray-200">
                <button onclick="changeMonth(-1)" class="p-2 px-4 rounded-md hover:bg-white hover:shadow-sm transition text-gray-600 hover:text-gray-900">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <h2 id="monthYear" class="text-lg font-semibold w-40 text-center text-gray-800"></h2>
                <button onclick="changeMonth(1)" class="p-2 px-4 rounded-md hover:bg-white hover:shadow-sm transition text-gray-600 hover:text-gray-900">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
            
            <button onclick="goToToday()" class="px-4 py-2 bg-blue-50 text-blue-600 font-medium rounded-lg hover:bg-blue-100 transition border border-blue-100">
                Today
            </button>
            <button id="adminToggle" class="px-4 py-2 bg-gray-50 text-gray-600 font-medium rounded-lg hover:bg-gray-100 transition border border-gray-200">
                <i class="fa-solid fa-lock"></i> Viewer
            </button>
        </div>

        <!-- Calendar Area -->
        <div class="bg-white rounded-b-2xl shadow-sm border border-gray-200 p-6 flex-grow flex flex-col">
            <!-- Days of Week -->
            <div class="grid grid-cols-7 gap-2 mb-4">
                <div class="text-center font-semibold text-gray-500 text-sm py-2">Sun</div>
                <div class="text-center font-semibold text-gray-500 text-sm py-2">Mon</div>
                <div class="text-center font-semibold text-gray-500 text-sm py-2">Tue</div>
                <div class="text-center font-semibold text-gray-500 text-sm py-2">Wed</div>
                <div class="text-center font-semibold text-gray-500 text-sm py-2">Thu</div>
                <div class="text-center font-semibold text-gray-500 text-sm py-2">Fri</div>
                <div class="text-center font-semibold text-gray-500 text-sm py-2">Sat</div>
            </div>

            <!-- Calendar Grid -->
            <div id="calendarGrid" class="grid grid-cols-7 gap-2 flex-grow auto-rows-fr">
                <!-- Days will be generated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Event Modal (Hidden by default) -->
    <div id="eventModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden transform scale-95 transition-transform duration-300" id="modalContent">
            
            <!-- Modal Header -->
            <div class="bg-gray-50 p-4 border-b border-gray-100 flex justify-between items-center">
                <div>
                    <h3 class="font-bold text-lg text-gray-900" id="modalDateDisplay">Selected Date</h3>
                    <p class="text-xs text-gray-500">Manage events for this day</p>
                </div>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-700 p-2 rounded-full hover:bg-gray-200 transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <!-- Existing Events List -->
            <div class="p-4 max-h-48 overflow-y-auto no-scrollbar border-b border-gray-50 bg-white" id="eventListContainer">
                <p class="text-sm text-gray-500 italic py-2" id="noEventsMessage">No events scheduled.</p>
                <div id="eventList" class="flex flex-col gap-2">
                    <!-- Events will be listed here -->
                </div>
            </div>

            <!-- Add Event Form -->
            <div class="p-4 bg-white" id="addEventSection" style="display: none;">
                <h4 class="text-sm font-semibold text-gray-700 mb-3 uppercase tracking-wider">Add New Event</h4>
                <form id="addEventForm" onsubmit="addEvent(event)" class="flex flex-col gap-3">
                    <input type="hidden" id="selectedDateInput">
                    
                    <div>
                        <input type="text" id="eventTitle" placeholder="Event Title" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                    </div>
                    
                    <div class="flex gap-3">
                        <input type="time" id="eventTime" 
                            class="flex-grow px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition text-gray-700">
                        <select id="eventColor" class="px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                            <option value="blue">Blue</option>
                            <option value="red">Red</option>
                            <option value="green">Green</option>
                            <option value="purple">Purple</option>
                            <option value="orange">Orange</option>
                        </select>
                    </div>

                    <button type="submit" class="w-full mt-2 bg-blue-600 text-white font-medium py-2.5 rounded-lg hover:bg-blue-700 transition shadow-sm">
                        Save Event
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDWEdlfHZ8UlhW72a7A8awyH7dn9fHHGls",
            authDomain: "calander-52da6.firebaseapp.com",
            projectId: "calander-52da6",
            storageBucket: "calander-52da6.firebasestorage.app",
            messagingSenderId: "961876912196",
            appId: "1:961876912196:web:8ce925f2d7a9b33f8c3411",
            measurementId: "G-1C43XXZDW0"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "calander-52da6"; // Using your project ID as your unique database folder

        // State
        let currentDate = new Date();
        let events = {};
        let isAdmin = false;
        let currentUser = null;
        let unsubscribeEvents = null;

        const colorMap = {
            blue: 'bg-blue-100 text-blue-800 border-blue-200',
            red: 'bg-red-100 text-red-800 border-red-200',
            green: 'bg-emerald-100 text-emerald-800 border-emerald-200',
            purple: 'bg-purple-100 text-purple-800 border-purple-200',
            orange: 'bg-orange-100 text-orange-800 border-orange-200'
        };

        // Authentication Setup
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    try {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } catch (e) {
                        console.warn("Custom token mismatch (likely using personal Firebase config), falling back to anonymous sign-in.");
                        await signInAnonymously(auth);
                    }
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth error:", error);
            }
        };

        initAuth();

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                loadEvents();
            } else if (unsubscribeEvents) {
                unsubscribeEvents();
            }
        });

        // Load Events from Firestore
        function loadEvents() {
            if (!currentUser) return;
            
            const eventsRef = collection(db, 'artifacts', appId, 'public', 'data', 'calendar_events');
            
            unsubscribeEvents = onSnapshot(eventsRef, (snapshot) => {
                events = {}; // Reset events
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const dateString = data.date;
                    
                    if (!events[dateString]) {
                        events[dateString] = [];
                    }
                    
                    events[dateString].push({
                        id: doc.id,
                        title: data.title,
                        time: data.time,
                        color: data.color
                    });
                });
                renderCalendar();
                
                // Update modal if open
                const modal = document.getElementById('eventModal');
                if (!modal.classList.contains('hidden')) {
                    const dateString = document.getElementById('selectedDateInput').value;
                    updateModalEventList(dateString);
                }
            }, (error) => {
                console.error("Error fetching events:", error);
            });
        }

        // Admin Toggle Logic
        document.getElementById('adminToggle').addEventListener('click', () => {
            if (!isAdmin) {
                const password = prompt("Enter secret admin password (hint: type 'secret'):");
                if (password === 'secret') {
                    isAdmin = true;
                    document.getElementById('adminToggle').innerHTML = '<i class="fa-solid fa-unlock text-blue-600"></i> Admin';
                    document.getElementById('adminToggle').classList.add('bg-blue-50', 'text-blue-600', 'border-blue-200');
                } else if (password !== null) {
                    alert("Incorrect password.");
                }
            } else {
                isAdmin = false;
                document.getElementById('adminToggle').innerHTML = '<i class="fa-solid fa-lock"></i> Viewer';
                document.getElementById('adminToggle').classList.remove('bg-blue-50', 'text-blue-600', 'border-blue-200');
            }
            renderCalendar();
            
            // Re-evaluate modal state if open
            const modal = document.getElementById('eventModal');
            if (!modal.classList.contains('hidden')) {
                const dateString = document.getElementById('selectedDateInput').value;
                const dateParts = dateString.split('-');
                const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
                openModal(dateString, parseInt(dateParts[2]), monthNames[parseInt(dateParts[1])-1], dateParts[0]);
            }
        });

        // Navigation functions
        window.changeMonth = function(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
        }

        window.goToToday = function() {
            currentDate = new Date();
            renderCalendar();
        }

        // Core Render Function
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById('monthYear').textContent = `${monthNames[month]} ${year}`;

            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            const firstDayIndex = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'bg-gray-50/50 rounded-xl border border-dashed border-gray-200 min-h-[80px] sm:min-h-[100px]';
                grid.appendChild(emptyCell);
            }

            const today = new Date();
            const isCurrentMonth = today.getMonth() === month && today.getFullYear() === year;

            for (let i = 1; i <= daysInMonth; i++) {
                const dateString = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                const isToday = isCurrentMonth && today.getDate() === i;

                const cell = document.createElement('div');
                cell.className = `calendar-cell bg-white border rounded-xl p-2 min-h-[80px] sm:min-h-[100px] cursor-pointer flex flex-col gap-1 relative overflow-hidden ${isToday ? 'border-blue-400 ring-1 ring-blue-400 bg-blue-50/10' : 'border-gray-200 hover:border-blue-300'}`;
                
                cell.onclick = () => openModal(dateString, i, monthNames[month], year);

                const dayHeader = document.createElement('div');
                dayHeader.className = 'flex justify-between items-start';
                
                const dayNum = document.createElement('span');
                dayNum.className = `inline-flex items-center justify-center w-7 h-7 rounded-full text-sm font-medium ${isToday ? 'bg-blue-600 text-white' : 'text-gray-700'}`;
                dayNum.textContent = i;
                
                dayHeader.appendChild(dayNum);
                cell.appendChild(dayHeader);

                const dayEvents = events[dateString] || [];
                const eventsContainer = document.createElement('div');
                eventsContainer.className = 'flex flex-col gap-1 overflow-y-auto no-scrollbar flex-grow';

                dayEvents.forEach(evt => {
                    const evtDiv = document.createElement('div');
                    const colorClasses = colorMap[evt.color] || colorMap.blue;
                    evtDiv.className = `text-[10px] sm:text-xs px-1.5 py-0.5 rounded border truncate font-medium ${colorClasses}`;
                    
                    const timeText = evt.time ? `<span class="opacity-75 mr-1">${evt.time}</span>` : '';
                    evtDiv.innerHTML = `${timeText}${evt.title}`;
                    eventsContainer.appendChild(evtDiv);
                });

                if(dayEvents.length > 0) {
                   cell.appendChild(eventsContainer);
                }

                grid.appendChild(cell);
            }
        }

        // Modal Functions
        window.openModal = function(dateString, dayNum, monthName, year) {
            const modal = document.getElementById('eventModal');
            const modalContent = document.getElementById('modalContent');
            const addEventSection = document.getElementById('addEventSection');
            
            document.getElementById('modalDateDisplay').textContent = `${monthName} ${dayNum}, ${year}`;
            document.getElementById('selectedDateInput').value = dateString;
            
            document.getElementById('addEventForm').reset();
            
            if (isAdmin) {
                addEventSection.style.display = 'block';
            } else {
                addEventSection.style.display = 'none';
            }
            
            updateModalEventList(dateString);

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            modalContent.classList.remove('scale-95');
            modalContent.classList.add('scale-100');
            
            if (isAdmin) {
                setTimeout(() => document.getElementById('eventTitle').focus(), 100);
            }
        }

        window.closeModal = function() {
            const modal = document.getElementById('eventModal');
            const modalContent = document.getElementById('modalContent');
            
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }

        window.updateModalEventList = function(dateString) {
            const dayEvents = events[dateString] || [];
            const listContainer = document.getElementById('eventList');
            const noEventsMsg = document.getElementById('noEventsMessage');
            
            listContainer.innerHTML = '';
            
            if (dayEvents.length === 0) {
                noEventsMsg.style.display = 'block';
            } else {
                noEventsMsg.style.display = 'none';
                
                const sortedEvents = [...dayEvents].sort((a, b) => (a.time || '24:00').localeCompare(b.time || '24:00'));

                sortedEvents.forEach(evt => {
                    const colorClasses = colorMap[evt.color] || colorMap.blue;
                    
                    const item = document.createElement('div');
                    item.className = `flex justify-between items-center p-2 rounded-lg border ${colorClasses} bg-opacity-50`;
                    
                    const info = document.createElement('div');
                    info.className = 'flex items-center gap-2 overflow-hidden';
                    
                    if (evt.time) {
                        const timeSpan = document.createElement('span');
                        timeSpan.className = 'font-bold text-xs opacity-75 whitespace-nowrap';
                        timeSpan.textContent = evt.time;
                        info.appendChild(timeSpan);
                    }
                    
                    const titleSpan = document.createElement('span');
                    titleSpan.className = 'font-medium text-sm truncate';
                    titleSpan.textContent = evt.title;
                    info.appendChild(titleSpan);
                    
                    item.appendChild(info);
                    
                    if (isAdmin) {
                        const delBtn = document.createElement('button');
                        delBtn.className = 'text-current opacity-60 hover:opacity-100 transition p-1';
                        delBtn.innerHTML = '<i class="fa-solid fa-trash-can text-sm"></i>';
                        delBtn.onclick = () => deleteEvent(evt.id);
                        item.appendChild(delBtn);
                    }
                    
                    listContainer.appendChild(item);
                });
            }
        }

        // Event CRUD Operations (Firestore)
        window.addEvent = async function(e) {
            e.preventDefault();
            if (!isAdmin || !currentUser) return;
            
            const dateString = document.getElementById('selectedDateInput').value;
            const title = document.getElementById('eventTitle').value.trim();
            const time = document.getElementById('eventTime').value;
            const color = document.getElementById('eventColor').value;
            
            if (!title) return;
            
            try {
                const eventsRef = collection(db, 'artifacts', appId, 'public', 'data', 'calendar_events');
                await addDoc(eventsRef, {
                    date: dateString,
                    title,
                    time,
                    color,
                    createdAt: new Date().toISOString()
                });
                
                document.getElementById('addEventForm').reset();
                document.getElementById('eventColor').value = color;
                document.getElementById('eventTitle').focus();
            } catch (error) {
                console.error("Error adding event:", error);
                alert("Could not save event. Check console.");
            }
        }

        window.deleteEvent = async function(eventId) {
            if (!isAdmin || !currentUser) return;
            
            try {
                const eventDoc = doc(db, 'artifacts', appId, 'public', 'data', 'calendar_events', eventId);
                await deleteDoc(eventDoc);
            } catch (error) {
                console.error("Error deleting event:", error);
                alert("Could not delete event.");
            }
        }

        document.getElementById('eventModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('eventModal')) {
                closeModal();
            }
        });
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !document.getElementById('eventModal').classList.contains('hidden')) {
                closeModal();
            }
        });
        
        renderCalendar();
    </script>
</body>
</html>
